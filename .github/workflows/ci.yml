name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.compiler }}, ${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang
        variant:
          - name: coverage
            cflags: "--coverage"
          - name: O3
            cflags: "-O3"
          - name: valgrind
            cflags: "-O1 -g3"
            testrun_wrapper: "valgrind -q --error-exitcode=126 --track-origins=yes --leak-check=full"
          - name: sanitizers
            cflags: "-g3 -fsanitize=undefined -fsanitize=address -fsanitize=leak -fno-sanitize-recover=undefined"
    env:
      CC: ${{ matrix.compiler }}
      CFLAGS: ${{ matrix.variant.cflags }}
      TESTRUN_WRAPPER: ${{ matrix.variant.testrun_wrapper }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libsdl2-dev libsdl2-ttf-dev valgrind libkissfft-dev
      - name: Build and test
        run: make clean && make -j"$(nproc)" test

  # test without sdl installed
  linux-no-sdl:
    name: Linux (without SDL)
    runs-on: ubuntu-latest
    env:
      MAKE_FLAGS: CONFIG_fft_eval_sdl=n CONFIG_fft_eval_json=y V=s
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libkissfft-dev
      - name: Build and test
        run: make ${MAKE_FLAGS} clean && make ${MAKE_FLAGS} test

  # windows native build
  windows:
    name: Windows (MSYS2 ${{ matrix.msystem }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        msystem:
          - UCRT64
          - CLANG64
    defaults:
      run:
        shell: msys2 {0}
    env:
      MAKE_FLAGS: V=s
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: make which
          pacboy: >-
            gcc:p
            pkgconf:p
            SDL2:p
            SDL2_ttf:p
            kiss_fft:p
      - name: Build
        run: make ${MAKE_FLAGS} clean && make ${MAKE_FLAGS}

  # osx native build
  macos:
    name: macOS
    runs-on: macos-latest
    env:
      MAKE_FLAGS: V=s
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install pkgconf sdl2 sdl2_ttf cmake
      # kissfft is not packaged by Homebrew
      - name: Build kissfft
        run: |
          git clone --depth 1 --branch 131.2.0 https://github.com/mborgerding/kissfft.git "${RUNNER_TEMP}/kissfft"
          cmake -S "${RUNNER_TEMP}/kissfft" -B "${RUNNER_TEMP}/kissfft/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/kissfft-install" \
            -DCMAKE_INSTALL_BINDIR=bin \
            -DCMAKE_INSTALL_INCLUDEDIR=include \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DKISSFFT_DATATYPE=float \
            -DKISSFFT_STATIC=ON \
            -DKISSFFT_PKGCONFIG=ON \
            -DKISSFFT_TEST=OFF \
            -DKISSFFT_TOOLS=OFF
          cmake --build "${RUNNER_TEMP}/kissfft/build"
          cmake --install "${RUNNER_TEMP}/kissfft/build"
          echo "PKG_CONFIG_PATH=${RUNNER_TEMP}/kissfft-install/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" >> "${GITHUB_ENV}"
      - name: Build and test
        run: make ${MAKE_FLAGS} clean && make ${MAKE_FLAGS} test

  # reuse test
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
